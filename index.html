<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14110f">
  <title>임명장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- 로딩/연출 단계 -->
    <section id="loading" class="loading" aria-live="polite">
      <div class="seal" aria-hidden="true"></div>
      <p class="loading-text">당신의 운명은<span class="dots"><i>.</i><i>.</i><i>.</i></span>?</p>
    </section>

    <!-- 결과 공개 단계 -->
    <section id="result" class="result" hidden>
      <h1 id="result-title" class="result-title"></h1>
      <img id="result-image" class="result-image" alt="" decoding="async">
      <p id="result-error" class="result-error" hidden>이미지를 불러오지 못했습니다.</p>
      <p class="hint">이미지를 길게 누르면 저장할 수 있어요</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
